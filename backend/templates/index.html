<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易经 LLM 卜卦 / I Ching Divination</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="page">
  <div class="lang-bar">
    <button id="btn-lang-zh" class="lang-btn active" onclick="setLang('zh')">中文</button>
    <button id="btn-lang-en" class="lang-btn" onclick="setLang('en')">EN</button>
  </div>

  <h1 class="title" data-i18n="title">🔮 易经卜卦</h1>
  <p class="subtitle" data-i18n="subtitle">静心默念你的问题，掷六次硬币，让易经老人为你解卦</p>

  <div class="card">
    <div class="form-group">
      <label for="question" data-i18n="label_question">你想问什么？</label>
      <input type="text" id="question" maxlength="100" placeholder="" data-i18n-placeholder="placeholder_question">
    </div>

    <div id="coin-area">
      <button id="btn-throw" class="btn-primary" data-i18n="btn_throw">掷硬币</button>
      <div id="coin-result" class="coin-result" data-i18n-prefix="thrown"></div>
    </div>

    <div id="lines" class="lines"></div>

    <button id="btn-cast" class="btn-secondary" style="display:none" data-i18n="btn_cast">起卦解卦</button>
    <button id="btn-reset" class="btn-reset" style="display:none" data-i18n="btn_reset">重新起卦</button>
  </div>

  <div id="result" class="result" style="display:none">
    <div id="hexagram" class="hexagram"></div>
    <div id="reading" class="reading"></div>
    <div id="loading" class="loading" style="display:none" data-i18n="loading">卦象已成，易经老人正在推演…（可能需要片刻）</div>
  </div>

  <footer class="footer" data-i18n="footer">纯本地部署 · LLM 由环境变量配置 · 卦象算法零依赖</footer>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
